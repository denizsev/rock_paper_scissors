<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RPS Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Eater&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
      <link rel="stylesheet" href="main.css">
</head>
<body>

<h1>Rock Paper Scissors</h1>

<div class="score">
    <p>You: <span id="playerScore">0</span></p>
    <p>Computer: <span id="computerScore">0</span></p>
</div>

<h2 id="result">Choose your move</h2>

<div class="buttons">
    <button class="choice" data-choice="rock"> <i class="fa-solid fa-hand-back-fist"></i></button>
    <button class="choice" data-choice="paper"><i class="fa-solid fa-hand"></i></button>
    <button class="choice" data-choice="scissors"><i class="fa-solid fa-hand-scissors"></i></button>
</div>

<button id="restart"><i class="fa-solid fa-arrow-rotate-right"></i></button>

<script src="rps.js"></script>
</body>
</html>
